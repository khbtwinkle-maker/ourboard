          <input type="text" id="writeAuthor" placeholder="닉네임을 입력하세요 (선택)">

          <input type="file" id="writeImageFile" accept="image/*">

            <button type="button" id="imageRemoveBtn" class="btn-ghost btn-small">제거</button>

          <div class="write-actions">
            <span class="upload-status" id="uploadStatus"></span>
            <button type="button" class="btn-ghost" id="writeCancelBtn">취소</button>
            <button type="submit" class="btn-primary" id="writeSubmitBtn">등록하기</button>

<script>
  /* ---------------- 아이콘 (인라인 SVG, feather 스타일) ---------------- */
  var ICONS = {
    logo: '<svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-9.5-9C.7 7.2 2.3 4 5.5 4c2 0 3.2 1 3.5 2 .3-1 1.5-2 3.5-2 3.2 0 4.8 3.2 3 7-2.5 4.5-9 9-9 9z" transform="scale(0.85) translate(2,1)"/><path d="M8 12h1.5l1-2 2 4 1-2H15"/></svg>',
    user: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>',
    search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="20" y1="20" x2="15.8" y2="15.8"/></svg>',
    pencil: '<svg class="i" viewBox="0 0 24 24" stroke="white"><path d="M4 20l1-4.2L15.8 5 19 8.2 8.2 19 4 20z"/><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"/></svg>',
    home: '<svg class="i" viewBox="0 0 24 24"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>',
    chat: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v10H9l-4 4v-4H4z"/></svg>',
    question: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.5c.3-1.5 1.6-2.3 3-2.3 1.6 0 2.8 1 2.8 2.4 0 1.6-2.8 1.8-2.8 3.9"/><circle cx="12" cy="17" r=".4" fill="currentColor"/></svg>',
    info: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.6" r=".5" fill="currentColor"/></svg>',
    heart: '<svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.5 5 5.6 5c1.9 0 3.4 1.1 3.9 2.3.5-1.2 2-2.3 3.9-2.3 3.1 0 4.6 3 3 6.2C19.1 15.6 12 20 12 20z"/></svg>',
    photo: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M20 15l-4.5-4.5-3 3-2-2-6.5 6.5"/></svg>',
    palette: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3.5C7 3.5 3 7.3 3 12s4 8.5 9 8.5c1 0 1.6-.6 1.6-1.4 0-.4-.2-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.6-1.4 1.4-1.4h1.6c2.4 0 4.2-1.9 4.2-4.2C20 6.9 16.4 3.5 12 3.5z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7.8" r="1" fill="currentColor"/><circle cx="14.3" cy="7.8" r="1" fill="currentColor"/></svg>',
    megaphone: '<svg class="i" viewBox="0 0 24 24"><path d="M3 10v4h3l7 4V6l-7 4H3z"/><path d="M17 9.5c1 .8 1 4.2 0 5"/></svg>',
    sun: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>',
    eye: '<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.4"/></svg>',
    heartOutline: '<svg class="i" viewBox="0 0 24 24"><path d="M12 19s-6.5-4-8.5-8C2 8 3.3 5.5 6 5.5c1.7 0 3 1 3.5 2.1.5-1.1 1.8-2.1 3.5-2.1 2.7 0 4 2.5 2.5 5.5-2 4-8.5 8-8.5 8z"/></svg>',
    comment: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v10H9l-4 4v-4H4z"/></svg>',
    pin: '<svg class="i" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l1.5 5.5L19 9l-4.5 3L16 18l-4-3.2L8 18l1.5-6L5 9l5.5-1.5z"/></svg>'
  };
  function icon(name) { return ICONS[name] || ''; }

  var CATEGORY_ICON = { all: 'home', free: 'chat', qna: 'question', info: 'info', daily: 'heart', photo: 'photo', hobby: 'palette', notice: 'megaphone' };
  var CATEGORY_BADGE_CLASS = { free: 'badge-free', qna: 'badge-qna', info: 'badge-info', daily: 'badge-daily', photo: 'badge-photo', hobby: 'badge-hobby', notice: 'badge-notice' };

  var STATE = { categories: [], counts: {}, category: 'all', sort: 'latest', page: 1, keyword: '', currentPostId: null };

  document.addEventListener('DOMContentLoaded', boot);

  function boot() {
    setStaticIcons();
    bindEvents();
    google.script.run.withSuccessHandler(onInitData).withFailureHandler(onError).getInitData();
  }

  function setStaticIcons() {
    document.getElementById('icon-logo').innerHTML = icon('logo');
    document.getElementById('icon-user').innerHTML = icon('user');
    document.getElementById('icon-search-hero').innerHTML = icon('search');
    document.getElementById('icon-pencil').innerHTML = icon('pencil');
    document.getElementById('icon-sun').innerHTML = icon('sun');
  }

  function bindEvents() {
    document.getElementById('writeBtn').addEventListener('click', showWrite);
    document.getElementById('writeCancelBtn').addEventListener('click', backToList);
    document.getElementById('backBtn').addEventListener('click', backToList);
    document.getElementById('writeForm').addEventListener('submit', submitWrite);

    document.querySelectorAll('.sort-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.sort-tab').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        STATE.sort = btn.dataset.sort;
        STATE.page = 1;
        loadPosts();
      });
    });

    var heroInput = document.getElementById('heroSearchInput');
    heroInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        STATE.keyword = heroInput.value;
        STATE.category = 'all';
        STATE.page = 1;
        showListView();
        highlightCategory('all');
        loadPosts();
      }
    });
  }

  function onError(err) {
    console.error(err);
    alert('오류가 발생했습니다: ' + (err && err.message ? err.message : err));
  }

  /* ---------------- 초기 데이터 ---------------- */

  function onInitData(data) {
    STATE.categories = data.categories;
    STATE.counts = data.counts;
    buildCategoryList();
    renderPopular(data.popular);
    renderRecent(data.recent);
    loadPosts();
  }

  function buildCategoryList() {
    var wrap = document.getElementById('categoryList');
    wrap.innerHTML = '';
    STATE.categories.forEach(function (c, idx) {
      if (c.key === 'notice' && idx === STATE.categories.length - 1) {
        var div = document.createElement('div');
        div.className = 'category-divider';
        wrap.appendChild(div);
      }
      var item = document.createElement('div');
      item.className = 'category-item' + (c.key === STATE.category ? ' active' : '');
      item.dataset.key = c.key;
      item.innerHTML =
        '<span class="cat-icon">' + icon(CATEGORY_ICON[c.key] || 'chat') + '</span>' +
        '<span class="cat-label">' + escapeHtml(c.label) + '</span>' +
        '<span class="cat-count">' + (STATE.counts[c.key] || 0) + '</span>';
      item.addEventListener('click', function () {
        STATE.category = c.key;
        STATE.page = 1;
        STATE.keyword = '';
        showListView();
        highlightCategory(c.key);
        document.getElementById('boardTitle').textContent = c.label;
        loadPosts();
      });
      wrap.appendChild(item);
    });
  }

  function highlightCategory(key) {
    document.querySelectorAll('.category-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.key === key);
    });
    var label = (STATE.categories.filter(function (c) { return c.key === key; })[0] || {}).label || '전체 게시판';
    document.getElementById('boardTitle').textContent = label;
  }

  /* ---------------- 목록 ---------------- */

  function loadPosts() {
    google.script.run.withSuccessHandler(renderPostList).withFailureHandler(onError).getPosts({
      category: STATE.category, sort: STATE.sort, page: STATE.page, keyword: STATE.keyword
    });
  }

  function renderPostList(data) {
    STATE.page = data.page;
    var sub = document.getElementById('boardSub');
    sub.textContent = data.keyword ? ('"' + data.keyword + '" 검색 결과 ' + data.total + '건') : '다양한 이야기가 모이는 공간이에요.';

    var listEl = document.getElementById('postList');
    if (!data.posts.length) {
      listEl.innerHTML = '<div class="empty-state">게시글이 없어요.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    listEl.innerHTML = data.posts.map(renderPostRow).join('');
    Array.prototype.forEach.call(listEl.querySelectorAll('.post-row'), function (row) {
      row.addEventListener('click', function () { openPost(row.dataset.id); });
    });

    renderPagination(data);
  }

  function renderPostRow(p) {
    var badgeClass = p.category === 'notice' ? 'badge-notice' : (CATEGORY_BADGE_CLASS[p.category] || 'badge-free');
    var label = categoryLabel(p.category);
    var isNew = (new Date() - new Date(p.date)) < 24 * 3600 * 1000;
    return '' +
      '<div class="post-row" data-id="' + p.id + '">' +
        (p.pinned ? '<span class="pin-icon">' + icon('pin') + '</span>' : '') +
        '<div class="post-main">' +
          '<div class="post-tag-row">' +
            '<span class="badge ' + badgeClass + '">' + escapeHtml(label) + '</span>' +
            '<span class="post-title">' + escapeHtml(p.title) + '</span>' +
            (isNew && !p.pinned ? '<span class="new-badge">N</span>' : '') +
          '</div>' +
          '<div class="post-excerpt">' + escapeHtml(p.content) + '</div>' +
          '<div class="post-meta">' +
            '<span class="post-author-avatar">' + escapeHtml((p.author || '?').charAt(0)) + '</span>' +
            '<span>' + escapeHtml(p.author) + '</span>' +
            '<span class="dot"></span><span>' + formatRelativeTime(p.date) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="post-stats">' +
          '<span class="stat"><span class="icon">' + icon('eye') + '</span>' + p.views + '</span>' +
          '<span class="stat"><span class="icon">' + icon('heartOutline') + '</span>' + p.likes + '</span>' +
          '<span class="stat"><span class="icon">' + icon('comment') + '</span>' + p.commentCount + '</span>' +
        '</div>' +
        (p.image ? '<img class="post-thumb" src="' + escapeAttr(p.image) + '">' : '') +
      '</div>';
  }

  function renderPagination(data) {
    var el = document.getElementById('pagination');
    var html = '<button class="page-btn" id="prevPage" ' + (data.page <= 1 ? 'disabled' : '') + '>‹</button>';
    for (var i = 1; i <= data.totalPages; i++) {
      html += '<button class="page-btn' + (i === data.page ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    html += '<button class="page-btn" id="nextPage" ' + (data.page >= data.totalPages ? 'disabled' : '') + '>›</button>';
    el.innerHTML = html;

    var prev = document.getElementById('prevPage');
    var next = document.getElementById('nextPage');
    if (prev) prev.addEventListener('click', function () { STATE.page--; loadPosts(); });
    if (next) next.addEventListener('click', function () { STATE.page++; loadPosts(); });
    Array.prototype.forEach.call(el.querySelectorAll('[data-page]'), function (btn) {
      btn.addEventListener('click', function () { STATE.page = Number(btn.dataset.page); loadPosts(); });
    });
  }

  /* ---------------- 사이드바 (인기글/최근글) ---------------- */

  function renderPopular(list) {
    var el = document.getElementById('popularList');
    el.innerHTML = list.map(function (p, i) {
      return '<li data-id="' + p.id + '"><span class="rank-num">' + (i + 1) + '</span>' +
        '<span class="rank-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="rank-views">' + p.views + '</span></li>';
    }).join('');
    bindSidebarClicks(el);
  }

  function renderRecent(list) {
    var el = document.getElementById('recentList');
    el.innerHTML = list.map(function (p) {
      return '<li data-id="' + p.id + '"><span class="recent-avatar">' + escapeHtml((p.author || '?').charAt(0)) + '</span>' +
        '<div><div class="recent-title">' + escapeHtml(p.title) + '</div>' +
        '<div class="recent-time">' + formatRelativeTime(p.date) + '</div></div></li>';
    }).join('');
    bindSidebarClicks(el);
  }

  function bindSidebarClicks(el) {
    Array.prototype.forEach.call(el.querySelectorAll('[data-id]'), function (li) {
      li.addEventListener('click', function () { openPost(li.dataset.id); });
    });
  }

  /* ---------------- 상세 보기 ---------------- */

  function openPost(id) {
    google.script.run.withSuccessHandler(function (post) {
      STATE.currentPostId = post.id;
      renderDetail(post);
      showDetailView();
    }).withFailureHandler(onError).getPost(id);
  }

  function renderDetail(post) {
    var badgeClass = post.category === 'notice' ? 'badge-notice' : (CATEGORY_BADGE_CLASS[post.category] || 'badge-free');
    var html = '' +
      '<div class="detail-header">' +
        '<span class="badge ' + badgeClass + '">' + escapeHtml(categoryLabel(post.category)) + '</span>' +
        '<h1 class="detail-title">' + escapeHtml(post.title) + '</h1>' +
        '<div class="detail-meta">' +
          '<span class="post-author-avatar">' + escapeHtml((post.author || '?').charAt(0)) + '</span>' +
          '<span>' + escapeHtml(post.author) + '</span><span class="dot"></span>' +
          '<span>' + formatRelativeTime(post.date) + '</span><span class="dot"></span>' +
          '<span>조회 ' + post.views + '</span>' +
        '</div>' +
      '</div>' +
      (post.image ? '<img class="detail-image" src="' + escapeAttr(post.image) + '">' : '') +
      '<div class="detail-body">' + escapeHtml(post.content) + '</div>' +
      '<div class="detail-actions"><button class="like-btn" id="likeBtn">' + icon('heartOutline') + ' 좋아요 <span id="likeCount">' + post.likes + '</span></button></div>' +
      '<div class="comments-block">' +
        '<h3>댓글 ' + post.comments.length + '</h3>' +
        '<div id="commentList">' + post.comments.map(renderComment).join('') + '</div>' +
        '<div class="comment-form">' +
          '<input type="text" class="c-author" id="commentAuthor" placeholder="닉네임">' +
          '<input type="text" class="c-content" id="commentContent" placeholder="댓글을 남겨보세요">' +
          '<button id="commentSubmitBtn">등록</button>' +
        '</div>' +
      '</div>';
    document.getElementById('detailContent').innerHTML = html;

    document.getElementById('likeBtn').addEventListener('click', function () { doLike(post.id); });
    document.getElementById('commentSubmitBtn').addEventListener('click', function () { submitComment(post.id); });
    document.getElementById('commentContent').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitComment(post.id);
    });
  }

  function renderComment(c) {
    return '<div class="comment-item"><div class="comment-head">' + escapeHtml(c.author) +
      '<span class="time">' + formatRelativeTime(c.date) + '</span></div>' +
      '<div class="comment-body">' + escapeHtml(c.content) + '</div></div>';
  }

  function doLike(id) {
    google.script.run.withSuccessHandler(function (res) {
      document.getElementById('likeCount').textContent = res.likes;
    }).withFailureHandler(onError).likePost(id);
  }

  function submitComment(postId) {
    var authorEl = document.getElementById('commentAuthor');
    var contentEl = document.getElementById('commentContent');
    var content = contentEl.value.trim();
    if (!content) return;
    google.script.run.withSuccessHandler(function (c) {
      document.getElementById('commentList').insertAdjacentHTML('beforeend', renderComment(c));
      document.querySelector('.comments-block h3').textContent = '댓글 ' + c.commentCount;
      contentEl.value = '';
    }).withFailureHandler(onError).addComment({ postId: postId, author: authorEl.value, content: content });
  }

  /* ---------------- 글쓰기 ---------------- */

  function showWrite() {
    var sel = document.getElementById('writeCategory');
    if (!sel.options.length) {
      sel.innerHTML = STATE.categories.filter(function (c) { return c.key !== 'all'; })
        .map(function (c) { return '<option value="' + c.key + '">' + escapeHtml(c.label) + '</option>'; }).join('');
    }
    document.getElementById('writeForm').reset();
    setView('write');
  }

  function submitWrite(e) {
    e.preventDefault();
    var payload = {
      category: document.getElementById('writeCategory').value,
      author: document.getElementById('writeAuthor').value,
      title: document.getElementById('writeTitle').value,
      content: document.getElementById('writeContentField').value,
      image: document.getElementById('writeImage').value
    };
    google.script.run.withSuccessHandler(function (res) {
      backToList();
      openPost(res.id);
      google.script.run.withSuccessHandler(onInitData).getInitData();
    }).withFailureHandler(onError).createPost(payload);
  }

  /* ---------------- 뷰 전환 ---------------- */

  function setView(name) {
    ['list', 'detail', 'write'].forEach(function (v) {
      document.getElementById('view-' + v).classList.toggle('hidden', v !== name);
    });
  }
  function showListView() { setView('list'); }
  function showDetailView() { setView('detail'); }
  function backToList() { setView('list'); loadPosts(); }

  /* ---------------- 유틸 ---------------- */

  function categoryLabel(key) {
    var found = STATE.categories.filter(function (c) { return c.key === key; })[0];
    return found ? found.label : key;
  }

  function formatRelativeTime(dateStr) {
    var d = new Date(dateStr);
    var diffMs = Date.now() - d.getTime();
    var min = Math.floor(diffMs / 60000);
    if (min < 1) return '방금 전';
    if (min < 60) return min + '분 전';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + '시간 전';
    var day = Math.floor(hr / 24);
    if (day < 7) return day + '일 전';
    var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
    return y + '.' + m + '.' + dd;
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function escapeAttr(str) { return escapeHtml(str); }
</script>
